<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>ABCD music editor</title>
    <script
        src="https://cdn.jsdelivr.net/combine/npm/tone@14.7.58,npm/@magenta/music@1.23.1/es6/core.js,npm/focus-visible@5,npm/html-midi-player@1.5.0"></script>
    <script src="https://unpkg.com/tone"></script>
    <script type="module" src="https://unpkg.com/ninja-keys?module"></script>
    <script src="https://unpkg.com/split.js/dist/split.min.js"></script>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.5.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="lib/abcjs-audio.css" media="all" type="text/css" />

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="stylePrint.css">

</head>

<body>
    <dialog id="dialogOpen">
        <p>Open an existing already saved score:</p>
        <select name="cars" id="selectFilename">
        </select>
        <button id="dialogOpenButtonOpen">Open</button>
        <button id="dialogOpenButtonCancel">Cancel</button>
    </dialog>



    <div id="toolbar-panel">
        <div id="toolbar">
            <span class="toolbarPart">
                <button id="buttonDialogOpen" title="open a score">📂</button>
                <button id="buttonSave" title="save the score">💾</button>
                <button id="buttonPrint" title="print the score" onclick="window.print()">⎙</button>

            </span>

            <span class="toolbarPart">
                <button id="buttonExportMIDI">MIDI</button>
                <button id="buttonExportABC">ABC</button>
            </span>

            <div class="toolbarPart" id="toolbarInsert"></div>

            <span hidden="hidden" class="toolbarPart">
                <button title="menu of actions" id="buttonActionMenu">🦄</button>
                <button title="shift one octave down" id="button8down">8↓</button>
                <button title="shift one octave up" id="button8up">8↑</button>
            </span>
            <input checked type="checkbox" id="recordMidi">
            <label for="recordMidi" title="works on Chrome only">record Midi</label>

            <div id="midi"></div>

            <a id="help" href="https://github.com/francoisschwarzentruber/abcd" target="_blank">?</a>

        </div>
        <div id="audio"></div>

        <ninja-keys placeholder="Search actions..."></ninja-keys>

    </div>


    <div id="container">
        <div id="editor-panel">
        </div>

        <div id="output-panel">
            <div id="output"></div>
        </div>


    </div>



    <script src="lib/abcjs-basic-min.js"></script>
    <script src="lib/abcjs-basic-min.js"></script>

    <script type="module" src="js/rhythmguess.js"></script>
    <script type="module" src="js/score.js"></script>

    <script type="module" src="js/save.js"></script>
    <script type="module" src="js/editor.js"></script>
    <script type="module" src="js/abcd2abc.js"></script>
    <script type="module" src="js/abcddefinitions.js"></script>
    <script type="module" src="js/duration.js"></script>
    <script type="module" src="js/element.js"></script>
    <script type="module" src="js/pitch.js"></script>
    <script type="module" src="js/harmony.js"></script>
    <script type="module" src="js/midiinput.js"></script>
    <script type="module" src="js/playnote.js"></script>

    <script type="module" src="js/matchingCodeRendering.js"></script>

    <script type="module" src="js/gui.js"></script>
    <script type="module" src="js/midiinputgui.js"></script>






    <script type="module" src="js/pianokeyboard.js"></script>



    <span class="toolbarPart tooltip-container"> <piano-keyboard octaves="7" id="myPiano"></piano-keyboard>


        <div class="tooltip-content">
            <div id="notesnapshot">

            </div>
        </div>
    </span>



    <script type="module" src="js/pianokeyboardgui.js"></script>
    <script type="module" src="js/editorcontext.js"></script>

    <script type="module" src="js/actions.js"></script>


</body>

</html>
